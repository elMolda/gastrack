name: gastrack-local

# These credentials are deterministic development-only values. They are safe to
# commit for local use and must never be reused in a deployed environment.
x-local-supabase: &local-supabase
  POSTGRES_PASSWORD: gastrack-local-postgres
  JWT_SECRET: gastrack-local-jwt-secret-change-me-32-chars
  ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzY3MjI1NjAwLCJleHAiOjIwODI3NTg0MDB9.-dVcEDTrFKnPg11HtvDdwsg3F2vYFKZ0ppjAEd4qw-Q
  SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtbG9jYWwiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6MjA4Mjc1ODQwMH0.M3QJrnPyvG2W7jLsFazX3HCWB8jEk24CWKmnIqJO0e0

services:
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      <<: *local-supabase
      POSTGRES_DB: postgres
      JWT_EXP: "3600"
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/supabase/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./docker/supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *local-supabase
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:8000/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:gastrack-local-postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: gastrack-local-jwt-secret-change-me-32-chars
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrations:
    build:
      context: .
      target: development
    environment:
      PGSSLMODE: disable
      SUPABASE_TELEMETRY_DISABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    command:
      - npx
      - supabase
      - db
      - push
      - --db-url
      - postgresql://postgres:gastrack-local-postgres@db:5432/postgres?sslmode=disable
      - --yes
    restart: "no"

  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:gastrack-local-postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: gastrack-local-jwt-secret-change-me-32-chars
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: gastrack-local-jwt-secret-change-me-32-chars
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
      PGRST_ADMIN_SERVER_PORT: "3001"
    healthcheck:
      test: ["CMD-SHELL", "PGRST_SERVER_HOST=localhost postgrest --ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  realtime:
    image: supabase/realtime:v2.102.3
    container_name: realtime-dev.supabase-realtime
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: gastrack-local-postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: gastrack-local-jwt-secret-change-me-32-chars
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzY3MjI1NjAwLCJleHAiOjIwODI3NTg0MDB9.-dVcEDTrFKnPg11HtvDdwsg3F2vYFKZ0ppjAEd4qw-Q
      SECRET_KEY_BASE: gastrack-local-realtime-secret-key-base-must-be-at-least-sixty-four-characters-long
      METRICS_JWT_SECRET: gastrack-local-jwt-secret-change-me-32-chars
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer $$ANON_KEY\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      realtime:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./docker/supabase/kong/kong.yml:/home/kong/temp.yml:ro
      - ./docker/supabase/kong/entrypoint.sh:/home/kong/entrypoint.sh:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzY3MjI1NjAwLCJleHAiOjIwODI3NTg0MDB9.-dVcEDTrFKnPg11HtvDdwsg3F2vYFKZ0ppjAEd4qw-Q
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtbG9jYWwiLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6MjA4Mjc1ODQwMH0.M3QJrnPyvG2W7jLsFazX3HCWB8jEk24CWKmnIqJO0e0
    entrypoint: ["/bin/sh", "/home/kong/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
    environment:
      PUBLIC_SUPABASE_URL: http://localhost:8000
      PRIVATE_SUPABASE_URL: http://kong:8000
      PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzY3MjI1NjAwLCJleHAiOjIwODI3NTg0MDB9.-dVcEDTrFKnPg11HtvDdwsg3F2vYFKZ0ppjAEd4qw-Q
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  node-modules:
