# Local stack: Postgres + SvelteKit app (Drizzle / Better Auth).
# Uses `.env.local` for secrets. Production values live in `.env.production`
# (Cloudflare Pages) — not this Compose file.
#
# First time:
#   cp .env.local.example .env.local
#   # fill GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#
# Day to day:
#   docker compose up --build
#   docker compose down
#   docker compose down -v   # wipe local DB
#
name: gastrack-local

x-app-env: &app-env
  # Inside the Docker network, Postgres is hostname `db`.
  DATABASE_URL: postgresql://gastrack:gastrack@db:5432/gastrack
  BETTER_AUTH_URL: http://localhost:5173
  CHOKIDAR_USEPOLLING: "true"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: gastrack
      POSTGRES_PASSWORD: gastrack
      POSTGRES_DB: gastrack
    volumes:
      - local-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastrack -d gastrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - local-node-modules:/app/node_modules
    # Entrypoint installs deps if needed, then runs migrations before the CMD.

volumes:
  local-pg-data:
  local-node-modules:
