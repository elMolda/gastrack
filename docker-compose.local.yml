# Local stack: Postgres + migrate + SvelteKit app (Drizzle / Better Auth path).
# Uses `.env.local` for secrets. Production values live in `.env.production`
# (Cloudflare Pages) — not this Compose file.
#
# First time:
#   cp .env.local.example .env.local
#   # fill GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (and anything else you need)
#
# Day to day:
#   docker compose -f docker-compose.local.yml up --build
#   docker compose -f docker-compose.local.yml down
#   docker compose -f docker-compose.local.yml down -v   # wipe local DB
#
# One-off inside the app container:
#   docker compose -f docker-compose.local.yml exec app npm run check
#   docker compose -f docker-compose.local.yml exec app npm run db:generate
#
name: gastrack-local

x-app-env: &app-env
  # Inside the Docker network, Postgres is reachable as hostname `postgres`.
  # This overrides whatever DATABASE_URL is in `.env.local` (which uses
  # 127.0.0.1:5433 for rare host-side tools).
  DATABASE_URL: postgresql://gastrack:gastrack@postgres:5432/gastrack
  BETTER_AUTH_URL: http://localhost:5173
  CHOKIDAR_USEPOLLING: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: gastrack
      POSTGRES_PASSWORD: gastrack
      POSTGRES_DB: gastrack
    volumes:
      - local-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastrack -d gastrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: development
    env_file:
      - .env.local
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - local-node-modules:/app/node_modules
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - local-node-modules:/app/node_modules
    # CMD comes from the image; entrypoint ensures node_modules exists

volumes:
  local-pg-data:
  local-node-modules:
